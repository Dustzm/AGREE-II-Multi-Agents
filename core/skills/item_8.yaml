item_id: item_8
enabled: true
domain: 3
domain_name: Rigor of Development
domain_name_zh: 制定严谨性
title: The criteria for selecting the evidence are clearly described.
title_zh: 清楚描述选择证据的标准。
description: Criteria for including/excluding evidence identified by the search should
  be provided.
description_zh: '应提供检索时纳入和排除证据的标准。

  '
locating_info: Check Method, Literature Search, Inclusion/Exclusion Criteria, and
  Appendices sections
locating_info_zh: 查看方法、文献检索、纳入/排除标准、附录章节。
criteria:
- 排除标准描述：在纳入标准规定只纳入英文文献，即逻辑上在排除标准里已经排除了非英文文献。
- 研究设计、PICO、语言、背景等必须包含在纳入/排除标准中，单独的PICO、背景等信息不可作为评分依据
scoring_principle:
- range: '1'
  condition: Not mentioned
  condition_zh: 未提及
- range: 2-3
  condition: simple mention of inclusion (and/or exclusion) criteria
  condition_zh: 简单提及纳入（和/或排除）标准
- range: 4-7
  condition: The inclusion (and/or exclusion) criteria must be clearly stated, including
    such elements as study design, PICO, language, and setting; 1 point for each mentioned
    element, 2 points for mentioning PICO, with a maximum of 7 points. If clear inclusion
    and exclusion criteria are not provided, this rating level cannot be awarded.
  condition_zh: 必须清晰说明纳入（和/或排除）标准，在此标准中包含如研究设计、PICO、语言、背景等，提及1个加1分，提及PICO加2分，最高7分，如果没有清晰的纳入排除标准，不可进入此档评分

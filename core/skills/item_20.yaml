title: The potential resource implications of applying the recommendations have been
  considered.
title_zh: 指南考虑了推荐意见应用时潜在的相关资源。
description: 'The recommendations may require additional resources in order to be
  applied. These may have cost implications for health care budgets. There should
  be a discussion in the guideline of the potential impact of the recommendations
  on resources. '
description_zh: '推荐意见可能需要应用额外的资源。这可能与卫生预算费用相关，将在推荐意见可能对资源影响的指南中讨论。'
locating_info: Check Methods, Recommendations, Implementation, Appendices sections.
locating_info_zh: 查看方法、推荐意见、实施、附录章节。
criteria:
- 例如，可能需要一个更专业的团队，新的设备，昂贵的药物治疗。通常在指南中标示为：成本利用、成本有效率、采集费用、相关预
- 算等相关的信息。

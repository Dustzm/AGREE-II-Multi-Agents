  '
criteria:
- Target population (目标人群)
- Clinical status (临床状态)
- Severity/Stage (严重程度/分期)
- Comorbidities (合并症)
- Exclusion criteria (排除标准)
scoring_principle:
- range: '1'
  condition: Not mentioned
  condition_zh: 未提及
- range: 2-3
  condition: Rough description of category
  condition_zh: 仅有人群类别的粗略描述
- range: 4-6
  condition: Detailed characteristics (gender, age, status)
  condition_zh: 详细的特征描述（性别、年龄、状态）
- range: '7'
  condition: Detailed characteristics + Disease staging + Exclusion criteria
  condition_zh: 详细特征 + 疾病分期 + 排除标准

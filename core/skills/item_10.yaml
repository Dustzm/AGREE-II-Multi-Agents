item_id: item_10
enabled: true
domain: 3
domain_name: Rigor of Development
domain_name_zh: 制定严谨性
title: The methods for formulating the recommendations are clearly described.
title_zh: 清楚描述形成推荐意见的方法。
description: 'A description of the methods used to formulate the recommendations and
  how final decisions were arrived at should be provided. For example, methods may
  include a voting system, informal consensus, and formal consensus techniques (e.g.,
  Delphi, Glaser techniques). Areas of disagreement and methods of resolving them
  should be specified. '
description_zh: '应当描述形成推荐建议的方法和如何得出最终的决定。方法很多，比如投票法、非正式共识法、正式共识会议（如特尔菲法，Glaser方法），还应该说明有争议
  的地方和解决争议的方法。'
locating_info: Check Method and Appendices sections.
locating_info_zh: 查看方法、附录章节。
criteria: []
scoring_principle:
- range: '1'
  condition: Not mentioned
  condition_zh: 未提及
- range: 2-3
  condition: Only provided recommendation generation method (e.g., merely stating
    Delphi, consensus processes, or voting)
  condition_zh: 提及了形成推荐意见的方法，但无细节，如仅说明用德尔菲、共识、投票等
- range: 4-5
  condition: Provided recommendation generation method and described specific process
    (e.g., steps used in modified Delphi technique, voting procedures that were considered,
    reference to the Evidence-to-Decision [EtD] framework) or results (e.g., extent
    to which consensus was reached using modified Delphi technique, outcome of voting
    procedures)
  condition_zh: 描述了形成推荐的具体过程（如德尔菲法步骤、参考ETD框架等）或给出了过程的结果（如共识度）
- range: 6-7
  condition: 'Comprehensive description of process, results, and impact on final recommendations
    (e.g., results of Delphi technique influence final recommendation, alignment with
    recommendations and the final vote) '
  condition_zh: 既详细描述了形成推荐的过程，也说明了结果，并阐述了该过程如何影响最终推荐意见

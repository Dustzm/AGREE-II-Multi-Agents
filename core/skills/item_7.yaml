domain_name: Rigor of Development
domain_name_zh: 制定严谨性
title: Systematic methods were used to search for evidence.
title_zh: 应用系统方法检索证据。
description: "Details of the strategy used to search for evidence should be provided\
  \ including search terms used, sources consulted, and dates of the literature covered.\
  \ The search strategy should be as comprehensive as possible and executed in a manner\
  \ free from potential biases and sufficiently detailed to be replicated. \n"
description_zh: 应提供检索证据的详细策略，包括使用的检索词、信息来源、文献涵盖的时间。检索策略应尽可能地便于理解和消除偏倚，并十分详尽，以便重复。
locating_info: Check Method, Literature Search Strategy, and Appendices sections.
locating_info_zh: 查看方法、文献检索策略、附录章节。
criteria: []
scoring_principle:
- range: '1'
  condition: Not mentioned
  condition_zh: 未提及
- range: '2'
  condition: Mention of search databases without specific information (e.g., databases
    were searched)
  condition_zh: 提及了检索数据库但未提供具体信息，例：检索数据库
- range: '3'
  condition: Identification of search databases without specific search information
    (e.g., PubMed, CNKI, etc.)
  condition_zh: 明确指出了数据库但未提供具体的检索信息，例：检索数据库Pubmed，CNKI等
- range: '4'
  condition: Clear database and search terms
  condition_zh: 明确指出了数据库及检索词
- range: '5'
  condition: Clear database, search time, search terms
  condition_zh: 明确指出了数据库、检索时间、检索词
- range: 6-7
  condition: Clear database, search time, search terms, complete search strategy
  condition_zh: 明确指出了数据库、检索时间、检索词，并给出完整的检索策略

item_id: item_4
enabled: true
domain: 2
domain_name: Stakeholder Involvement
domain_name_zh: 利益相关者参与
title: The guideline development group includes individuals from all relevant professional
  groups.
title_zh: 指南开发小组包括了所有相关专业的人员。
description: 'This item refers to the professionals who were involved at some stage
  of the development process. This item excludes individuals who have externally reviewed
  the guideline. This item excludes target population representation. Information
  about the composition, discipline, and relevant expertise of the guideline development
  group should be provided. '
description_zh: 该条目是关于指南开发过程中涉及到的专业人员，但不包括对指南进行外部审查的个人和目标人群代表；同时，应提供指南开发小组的组成、原则和有关专家经验方面的信息。
locating_info: Check Abstract, Introduction, Methods, Group Members List, Acknowledgments
  and Appendices.
locating_info_zh: 查看摘要、引言、方法、指南小组成员名单、致谢和附件章节。
criteria:
- 指南小组成员分组包含：起草人、执笔人、指南指导委员会、临床专家组、系统评价组、秘书组、外部评审组、共识专家组、指南制订工作组等。
- 机构单位中通常会包含专业/学科/科室，注意排查
scoring_principle:
- range: '1'
  condition: Not mentioned
  condition_zh: 未提及
- range: 2-7
  condition: Provide ① personnel name, ② specialty/discipline/department, ③ institution,
    ④ geographic location, ⑤ role of the member in the guideline development team,
    and ⑥ multidisciplinary team members (e.g., methodologists, clinicians, nurses,
    etc., the more comprehensive, the better); add 1 point for each item provided
    on top of 1 point, with a maximum total score of 7 points.
  condition_zh: 提供①人员名称、②专业/学科/科室、③机构、④地理位置、⑤成员在指南开发小组中的角色、⑥多学科团队（如方法学家、临床医生、护理人员等越全越好），在1分基础上每出现一项加1分，总分最多不超过7分

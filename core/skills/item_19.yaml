item_id: item_19
enabled: true
domain: 5
domain_name: Applicability
domain_name_zh: 适用性
title: The guideline provides advice and/or tools on how the recommendations can be
  put into practice.
title_zh: 指南提供应用推荐意见的意见和/或工具。
description: 'For a guideline to be effective it needs to be disseminated and implemented
  with additional materials. '
description_zh: "要使一个指南更为有效，需要一些附加的材料使之易于推广实施。 \n"
locating_info: Check Recommendations, Implementation, Appendices sections.
locating_info_zh: 查看推荐意见、实施、附录章节。
criteria:
- 例如，这些附加的材料可能包括：一个简介，一个快速参考手册，教具，来自于探索试验的结果，病人活页，计算机支持，以及提供任何和指南一起的附加材料。
scoring_principle:
- range: '1'
  condition: Not mentioned
  condition_zh: 未提及
- range: 2-4
  condition: Implementation section or paragraph
  condition_zh: 若指南含有独立实施部分或章节
- range: 5-6
  condition: Implementation section with tools/resources provided
  condition_zh: 若指南含有独立实施部分或章节，且提供了工具/资源
- range: '7'
  condition: Implementation section, tools provided, and usage guidance
  condition_zh: 若指南含有独立实施部分或章节，且提供了工具/资源，且提供工具/资源的使用说明或步骤
- range: 2-3
  condition: Provided one tool/resource when no separate implementation chapter exists
  condition_zh: 若指南没有独立实施部分或章节，提供一个工具/资源，但未说明如何使用
- range: 4-5
  condition: Provided two and more tools/resources when no separate implementation
    chapter exists
  condition_zh: 若指南没有独立实施部分或章节，提供两个及以上工具/资源，但未说明如何使用
- range: 6-7
  condition: Provided tools/resources and usage guidance when no separate implementation
    chapter exists
  condition_zh: 若指南没有独立实施部分或章节，提供了工具/资源且提供使用说明或步骤

services:
  backend:
    image: ama-backend:0.1
    container_name: ama-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '8011:8011'
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - ./input:/app/input
      - ./output:/app/output
      - ./benchmark/uploads:/app/benchmark/uploads
      - ./benchmark/output:/app/benchmark/output

  batch-worker:
    image: ama-backend:0.1
    container_name: ama-batch
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_started
    command: ["python", "-m", "web.backend.app.batch_worker"]
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - ./input:/app/input
      - ./output:/app/output
      - ./benchmark/uploads:/app/benchmark/uploads
      - ./benchmark/output:/app/benchmark/output

  mcp-worker:
    image: ama-backend:0.1
    container_name: ama-mcp-worker
    restart: unless-stopped
    stop_grace_period: 40s
    profiles: ["mcp"]
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_started
    command: ["python", "mcp/run_worker.py"]
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - ./input:/app/input
      - ./output:/app/output

  frontend:
    image: ama-frontend:0.1
    container_name: ama-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8011
    ports:
      - '8012:80'

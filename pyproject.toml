[project]
name = "agree-ii-multi-agents"
version = "0.1.0"
description = "Multi-agent appraisal of clinical practice guidelines with AGREE II"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "zmchen", email = "zmchen1021@gmail.com"}
]
keywords = ["AGREE II", "clinical practice guideline", "appraisal", "multi-agent", "llm"]

dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.20",
    
    # Google ADK (支持 OpenAI 兼容模型)
    "google-adk==1.21.0",
    "google-genai==1.56.0",
    "litellm==1.80.5",
    "mcp>=1.25.0,<2.0.0",
    
    # HTTP 客户端 (用于远程调用 MinerU API)
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    
    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic==2.12.5",
    "pydantic-settings>=2.0.0",
    
    # PDF 解析
    "pypdf>=5.6.0",
    "pdfplumber>=0.11.0",
    "PyMuPDF>=1.24.0",
    
    # CLI 界面
    
    # MinerU 基础依赖 (vlm-http-client 模式)
    "loguru>=0.7.2",
    "numpy>=1.21.6",
    "pandas>=1.3.0",
    "scikit-learn==1.9.0",
    "joblib==1.5.3",
    "pillow>=11.0.0",
    "pypdfium2>=4.30.0",
    "pdfminer.six==20250506",
    "pdftext>=0.6.2",
    "tqdm>=4.67.1",
    "requests",
    "click>=8.1.7",
    "opencv-python>=4.11.0.86",
    "openai==2.14.0",
    "json-repair>=0.46.2",
    "boto3>=1.28.43",
    "beautifulsoup4>=4.13.5,<5",
    "reportlab",
    "magika>=0.6.2,<1.1.0",
    "fast-langdetect>=0.2.3,<0.3.0",
    "scikit-image>=0.25.0,<1.0.0",
    "modelscope>=1.26.0",
    "huggingface-hub>=0.32.4",
    "mineru-vl-utils>=0.1.17,<1",
    "qwen-vl-utils>=0.0.14,<1",
    
    # 附件解析
    "python-docx>=1.2.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
        
    # URL 附件处理
    "trafilatura>=1.6.0",
    "markdownify>=0.11.6",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.urls]
Homepage = "https://gitee.com/dustzm/agree-ii-multi-agents"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# 明确指定包发现规则
[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "web*"]
exclude = ["input", "output", "tests*", "mineru*"]

[tool.setuptools.package-data]
"core.hybrid_router" = ["*.joblib"]

"core.config" = ["*.json"]
